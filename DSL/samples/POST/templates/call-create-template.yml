# Example of calling create template

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Example of calling create template"
  additive: true

validate_input:
  switch:
    - condition: ${!incoming.body.name}
      next: missing_name
  next: call_template

call_template:
  # Path is relative to <project>/<METHOD>/ — the loader keys DSLs as
  # `<METHOD>/<relative-path>` under the project. See src/steps/template.rs.
  template: "templates/create-entity"
  request_type: "POST"
  body:
    name: ${incoming.body.name}
    type: ${incoming.body.type || "default"}
  result: created_entity
  next: respond

respond:
  return:
    success: true
    entity: ${created_entity}
  next: end

missing_name:
  status: 400
  return:
    error: "Name is required"
  next: end
