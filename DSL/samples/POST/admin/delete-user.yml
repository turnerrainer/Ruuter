# Admin-only endpoint - requires admin guard to pass

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Admin-only endpoint - requires admin guard to pass"
  additive: true

validate_user_id:
  switch:
    - condition: ${!incoming.body.userId}
      next: missing_user_id
  next: simulate_delete

simulate_delete:
  assign:
    deleted_user:
      userId: ${incoming.body.userId}
      deleted_at: ${Date.now()}
      deleted_by: "admin"
  next: respond

respond:
  return:
    success: true
    deleted: ${deleted_user}
  next: end

missing_user_id:
  status: 400
  return:
    error: "userId is required"
  next: end
