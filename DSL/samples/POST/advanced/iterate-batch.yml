# Iterate step. Runs `do:` once per element of `over:`, binding the
# element to `as:`. When `collect:` is set, values from each iteration
# are gathered under `into:` in the parent context. `max_items:` caps
# the loop; a `return:` inside the body short-circuits the outer DSL.

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Iterate step. Runs `do:` once per element of `over:`, binding the"
  additive: true

setup:
  assign:
    orders: "${incoming.body.orders || []}"
  next: work

work:
  iterate:
    over: "${orders}"
    as: order
    max_items: 100
    do:
      - assign:
          net: "${order.qty * order.price}"
      # Skipping error handling here for brevity — real DSLs would
      # push errors into a separate `errors:` array via a second
      # `collect`.
    # Parens are required: bare `{...}` at the start of a JS expression
    # is parsed as a BLOCK. `({...})` forces object-literal parsing.
    collect: "${({ id: order.id, net: net })}"
    into: totals
  next: reply

reply:
  return: { count: "${totals.length}", totals: "${totals}" }
  status: 200
  next: end
