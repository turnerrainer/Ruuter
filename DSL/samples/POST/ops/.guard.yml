# Folder-wide guard: every POST /samples/ops/* needs Bearer token.
# The one exception (`inject-fault`) overrides this — see sibling
# `inject-fault.guard.yml`.

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. This guard still runs; the
# `override_ancestors: false` matches pre-T-12 semantics.
declaration:
  description: "Folder-wide guard: every POST /samples/ops/* needs Bearer token"
  override_ancestors: false

check:
  switch:
    - condition: "${!incoming.headers['authorization']}"
      next: deny
  next: ok

ok: { return: { auth: true }, next: end }
deny: { status: 401, return: { error: "ops: bearer token required" }, next: end }
