# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Json manipulation sample (javascript)"
  additive: true

extract_data:
  assign:
    input_data: ${incoming.body}
  next: transform

transform:
  assign:
    transformed:
      original: ${input_data}
      keys: ${Object.keys(input_data)}
      values: ${Object.values(input_data)}
      count: ${Object.keys(input_data).length}
      json_string: ${JSON.stringify(input_data)}
      has_name: ${input_data.hasOwnProperty('name')}
  next: respond

respond:
  return: ${transformed}
  next: end
