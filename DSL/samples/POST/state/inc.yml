# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Inc sample (state)"
  additive: true

read_counter:
  state:
    get:
      key: "counter"
      into: current
  next: bump

bump:
  assign:
    next_value: "${(current == null ? 0 : current) + 1}"
  next: write_counter

write_counter:
  state:
    set:
      key: "counter"
      value: "${next_value}"
  next: respond

respond:
  return:
    counter: "${next_value}"
  next: end
