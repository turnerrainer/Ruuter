# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Post data sample (http)"
  additive: true

send_data:
  call: http.post
  args:
    url: "https://jsonplaceholder.typicode.com/posts"
    body:
      title: ${incoming.body.title}
      body: ${incoming.body.content}
      userId: 1
    headers:
      Content-Type: "application/json"
  result: post_result
  next: respond

respond:
  status: 201
  return:
    message: "Data posted successfully"
    response: ${post_result.response.body}
  next: end
