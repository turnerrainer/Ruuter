# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Chained requests sample (http)"
  additive: true

get_user:
  call: http.get
  args:
    url: "https://jsonplaceholder.typicode.com/users/${incoming.body.userId}"
  result: user_data
  next: get_posts

get_posts:
  call: http.get
  args:
    url: "https://jsonplaceholder.typicode.com/posts"
    query:
      userId: ${incoming.body.userId}
  result: user_posts
  next: combine_data

combine_data:
  assign:
    combined:
      user: ${user_data.response.body}
      posts: ${user_posts.response.body}
  next: respond

respond:
  return: ${combined}
  next: end
