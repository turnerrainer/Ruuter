# Constants demo. `[#DOMAIN_URL]` and `#{PORT}` both come from
# constants.ini at DSL parse time (before the DSL is loaded), so the
# response body is a plain string with no runtime substitution.
# See book/src/dsl/constants.md for the syntax reference.

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Constants demo. `[#DOMAIN_URL]` and `#{PORT}` both come from"
  additive: true

respond:
  return:
    domain: "[#DOMAIN_URL]"
    also_domain: "#{DOMAIN_URL}"
    port: "#{PORT}"
    note: "Both bracket and brace forms are equivalent — pick whichever reads better."
  next: end
