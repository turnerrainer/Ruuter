# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "String operations sample (javascript)"
  additive: true

extract_text:
  assign:
    text: ${incoming.params.text || "Hello World"}
  next: process

process:
  assign:
    result:
      original: ${text}
      uppercase: ${text.toUpperCase()}
      lowercase: ${text.toLowerCase()}
      length: ${text.length}
      reversed: ${text.split('').reverse().join('')}
      words: ${text.split(' ')}
      firstChar: ${text.charAt(0)}
      lastChar: ${text.charAt(text.length - 1)}
  next: respond

respond:
  return: ${result}
  next: end
