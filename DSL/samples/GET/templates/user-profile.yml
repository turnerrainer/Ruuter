# Reusable template - fetches user profile

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Reusable template - fetches user profile"
  additive: true

fetch_user:
  call: http.get
  args:
    url: "https://jsonplaceholder.typicode.com/users/${incoming.params.userId}"
  result: user_data
  next: respond

respond:
  return: ${user_data.response.body}
  next: end
