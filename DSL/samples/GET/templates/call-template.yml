# Example of calling another DSL as template

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Example of calling another DSL as template"
  additive: true

call_user_template:
  # Path is relative to <project>/<METHOD>/ — the loader keys DSLs as
  # `<METHOD>/<relative-path>` under the project. See src/steps/template.rs.
  template: "templates/user-profile"
  request_type: "GET"
  query:
    userId: ${incoming.params.id}
  result: user_result
  next: enrich

enrich:
  assign:
    enriched:
      user: ${user_result}
      fetched_at: ${Date.now()}
      requested_by: ${incoming.params.requester}
  next: respond

respond:
  return: ${enriched}
  next: end
