# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Simple switch sample (conditionals)"
  additive: true

check_age:
  assign:
    age: ${parseFloat(incoming.params.age)}
  next: validate

validate:
  switch:
    - condition: ${age >= 18}
      next: adult
    - condition: ${age >= 13}
      next: teen
  next: child

adult:
  return:
    category: "adult"
    age: ${age}
    message: "You are an adult"
  next: end

teen:
  return:
    category: "teenager"
    age: ${age}
    message: "You are a teenager"
  next: end

child:
  return:
    category: "child"
    age: ${age}
    message: "You are a child"
  next: end
