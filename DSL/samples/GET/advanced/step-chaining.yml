# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Step chaining sample (advanced)"
  additive: true

step1:
  assign:
    initial_value: 10
  next: step2

step2:
  assign:
    doubled: ${initial_value * 2}
  next: step3

step3:
  assign:
    squared: ${doubled * doubled}
  next: step4

step4:
  assign:
    final_result:
      initial: ${initial_value}
      after_doubling: ${doubled}
      after_squaring: ${squared}
      total_operations: 3
  next: respond

respond:
  return: ${final_result}
  next: end
