# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "With headers sample (http)"
  additive: true

fetch_with_auth:
  call: http.get
  args:
    url: "https://api.example.com/protected"
    headers:
      Authorization: "Bearer ${incoming.headers.token}"
      X-API-Key: "[#API_KEY]"
  result: protected_data
  next: respond

respond:
  return: ${protected_data.response.body}
  next: end
