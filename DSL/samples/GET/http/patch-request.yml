# Sample: http.patch step. Body + headers are treated identically to
# http.post. `result` binds the response as
# `<name>.response.{status,body,headers}` into the caller's context.

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "Sample: http.patch step. Body + headers are treated identically to"
  additive: true

update:
  call: http.patch
  args:
    url: "https://httpbin.org/patch"
    headers:
      X-Client: "ruuter-on-rust"
    body:
      note: "ratcheted"
      when: "${new Date().toISOString()}"
  result: upstream
  timeout: 3000
  next: reply

reply:
  return:
    upstream_status: "${upstream.response.status}"
    upstream_body:   "${upstream.response.body}"
  status: 200
  next: end
