[package]
name = "ruuter-rs"
version = "0.3.2"
edition = "2021"
authors = ["Rainer Türner"]
license = "MIT"
description = "Declarative REST router - Rust implementation"
repository = "https://github.com/buerostack/ruuter"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "multipart"] }
boa_engine = "0.19"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry-otlp = "0.27"
tracing-opentelemetry = "0.28"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
notify = "7.0"
regex = "1.10"
once_cell = "1.20"
http = "1.1"
hyper = "1.5"

[dev-dependencies]
mockito = "1.5"
