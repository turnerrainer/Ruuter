[package]
name = "ruuter-on-rust"
version = "0.6.0"
edition = "2021"
authors = ["Rainer Türner"]
license = "Apache-2.0"
description = "Declarative REST router - Rust implementation"
repository = "https://github.com/turnerrainer/Ruuter"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
boa_engine = "0.19"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
notify = "7.0"
regex = "1.10"
once_cell = "1.20"
http = "1.1"
hyper = { version = "1.5", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
dashmap = "6.1"
indexmap = { version = "2.5", features = ["serde"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls", "url"] }
url = "2.5"
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
mockito = "1.5"

[[bin]]
name = "ruuter-on-rust"
path = "src/main.rs"

[[bin]]
name = "dsl-lint"
path = "src/bin/dsl_lint.rs"

[[bin]]
name = "dsl-test"
path = "src/bin/dsl_test.rs"
