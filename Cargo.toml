[package]
name = "ruuter-on-rust"
version = "0.9.10-rc"
edition = "2021"
authors = ["Rainer Türner"]
license = "Apache-2.0"
description = "Declarative REST router - Rust implementation"
repository = "https://github.com/turnerrainer/Ruuter"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
boa_engine = { version = "0.20", optional = true }
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
notify = "7.0"
notify-debouncer-full = "0.4"
arc-swap = "1.7"
regex = "1.10"
once_cell = "1.20"
http = "1.1"
hyper = { version = "1.5", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "http2", "server"] }
http-body-util = "0.1"
dashmap = "6.1"
indexmap = { version = "2.5", features = ["serde"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls", "url"] }
url = "2.5"
rand = "0.8"
rquickjs = { version = "0.6", optional = true, features = ["parallel", "futures", "chrono"] }
sha2 = "0.10"
# Audit finding 11 — inbound multipart/form-data parser (Java parity).
multer = "3"
bytes = "1"

[dev-dependencies]
mockito = "1.5"
tempfile = "3"
# Transitive of notify-debouncer-full; pulled in directly for tests
# that construct `DebouncedEvent` fixtures (needs `instant::Instant`).
instant = "0.1"

[[bin]]
name = "ruuter-on-rust"
path = "src/main.rs"

[[bin]]
name = "dsl-lint"
path = "src/bin/dsl_lint.rs"

[[bin]]
name = "dsl-test"
path = "src/bin/dsl_test.rs"

# Task 051 — pluggable ScriptEngine backends. Exactly one of
# `scripting-boa` (default) or `scripting-quickjs` must be enabled.
# The 047 spike feature is retained for regression-style testing
# of Send-compatibility invariants.
[features]
default = ["scripting-boa"]
scripting-boa = ["dep:boa_engine"]
scripting-quickjs = ["dep:rquickjs"]
spike-quickjs = ["dep:rquickjs"]

# Clippy posture. `cargo clippy --all-targets -- -D warnings` is the CI
# gate. Style lints below are downgraded because the test suite uses
# `let mut cfg = default(); cfg.x = …` as its dominant fixture pattern
# — mechanically rewriting into struct-update syntax would add churn
# without changing behaviour, and rewriting once wouldn't prevent
# drift as new tests land. We keep the lint's warn level so IDE hints
# still surface it.
[lints.clippy]
field_reassign_with_default = "allow"
# Doc-comment lint noise in tests/security_hardening.rs — the module
# docstring uses an intentional continuation indentation that clippy
# nudges toward "no indentation." Purely cosmetic.
doc_overindented_list_items = "allow"
# `- ` at the start of a wrapped doc line (e.g. `Runtime + Context`
# after an em-dash on the previous line) is treated as a list
# continuation. False positive for prose that happens to wrap into a
# hyphen-adjacent word. Purely cosmetic.
doc_list_item_no_indent = "allow"
doc_lazy_continuation = "allow"
