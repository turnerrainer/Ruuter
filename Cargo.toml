[package]
name = "ruuter-rs"
version = "0.1.0"
edition = "2021"
authors = ["Rainer Türner"]
license = "MIT"
description = "Declarative REST router - Rust implementation"
repository = "https://github.com/buerostack/ruuter"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# JavaScript engine
boa_engine = "0.19"

# Configuration
config = "0.14"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry-otlp = "0.27"
tracing-opentelemetry = "0.28"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# File watching for hot reload
notify = "7.0"

# Regex
regex = "1.10"
once_cell = "1.20"

# HTTP types
http = "1.1"
hyper = "1.5"

[dev-dependencies]
mockito = "1.5"
