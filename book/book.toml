[book]
title = "Ruuter-on-Rust"
authors = ["Rainer Türner"]
description = "Reference for third-party clients authoring DSLs against Ruuter-on-Rust 0.4.0."
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
git-repository-url = "https://github.com/turnerrainer/Ruuter"
edit-url-template = "https://github.com/turnerrainer/Ruuter/edit/dev/book/{path}"
site-url = "/Ruuter/"
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.playground]
runnable = false
