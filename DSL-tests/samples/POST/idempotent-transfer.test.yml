# DSL-authored idempotency (v0.7.0). The framework no longer sets
# Idempotency-Replayed, so this file exercises the DSL's state.set
# side effect and the returned body shape. Cross-scenario replay
# semantics belong in a dedicated dedup-lookup DSL — this sample
# only records the last transfer.
mode: inprocess

tests:
  - name: accepts a transfer and echoes it back
    request:
      method: POST
      path: /samples/idempotent-transfer
      headers:
        content-type: "application/json"
      body: { from: "A", to: "B", amount: 100 }
    expect:
      status: 202
      body_matches:
        accepted: true
        from: "A"
        to: "B"
        amount: 100
        ref: "$regex:^txn-\\d+$"

  - name: second call runs the DSL again (no framework replay)
    request:
      method: POST
      path: /samples/idempotent-transfer
      headers:
        content-type: "application/json"
      body: { from: "A", to: "B", amount: 100 }
    expect:
      status: 202
      body_matches:
        accepted: true
        from: "A"

  - name: different body runs and records the new transfer
    request:
      method: POST
      path: /samples/idempotent-transfer
      headers:
        content-type: "application/json"
      body: { from: "X", to: "Y", amount: 500 }
    expect:
      status: 202
      body_matches:
        accepted: true
        from: "X"
        to: "Y"

  - name: minimal request without an Idempotency-Key header still runs
    request:
      method: POST
      path: /samples/idempotent-transfer
      headers: { content-type: "application/json" }
      body: { from: "P", to: "Q", amount: 1 }
    expect:
      status: 202
      body_matches: { accepted: true }
