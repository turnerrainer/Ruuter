mode: inprocess

tests:
  - name: never-written key returns nulls
    request: { method: POST, path: /samples/scheduled/last-seen }
    expect:
      status: 200
      body: { response: { last_seen_ms: null, age_ms: null } }

  - name: seeded key returns numeric age
    setup:
      state:
        - project: samples
          key: heartbeat.last_seen_ms
          value: 1704067200000
    request: { method: POST, path: /samples/scheduled/last-seen }
    expect:
      status: 200
      body_matches:
        response:
          last_seen_ms: 1704067200000
          age_ms: "$type:number"
