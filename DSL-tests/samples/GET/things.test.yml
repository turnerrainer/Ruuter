mode: inprocess

# Exercises Java-parity path-param stripping (task 018): one DSL, three
# URL shapes.
tests:
  - name: list mode (no path params)
    request: { method: GET, path: /samples/things }
    expect:
      status: 200
      body: { response: { mode: "list", items: ["a", "b", "c"] } }

  - name: detail mode (one path param)
    request: { method: GET, path: /samples/things/abc-123 }
    expect:
      status: 200
      body: { response: { mode: "detail", id: "abc-123" } }

  - name: subresource (two path params)
    request: { method: GET, path: /samples/things/abc-123/legs }
    expect:
      status: 200
      body: { response: { mode: "sub", id: "abc-123", subresource: "legs" } }
