# Guard: DSL/samples/GET/vault/.guard.yml (in-folder guard, Java parity).
mode: inprocess

tests:
  - name: missing X-Vault-Token -> 401
    request: { method: GET, path: /samples/vault/secret }
    expect:
      status: 401
      body: { response: { error: "vault: missing x-vault-token header" } }

  - name: any X-Vault-Token unlocks the secret
    request:
      method: GET
      path: /samples/vault/secret
      headers: { x-vault-token: "ceremonial-string" }
    expect:
      status: 200
      body: { response: { secret: "42" } }
