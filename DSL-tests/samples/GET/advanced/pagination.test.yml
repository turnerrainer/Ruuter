mode: inprocess

tests:
  - name: defaults page=1 size=20 when params missing
    request: { method: GET, path: /samples/advanced/pagination }
    expect:
      status: 200
      body_matches:
        response:
          pagination: { page: 1, size: 20, offset: 0, limit: 20 }
          links:
            self: "$type:string"
            next: "$type:string"
            prev: null

  - name: honors explicit page/size
    request:
      method: GET
      path: /samples/advanced/pagination
      query: { page: "3", size: "50" }
    expect:
      status: 200
      body_matches:
        response:
          pagination: { page: 3, size: 50, offset: 100, limit: 50 }

  - name: clamps size to <=100
    request:
      method: GET
      path: /samples/advanced/pagination
      query: { page: "1", size: "500" }
    expect:
      status: 200
      body_matches:
        response:
          pagination: { size: 100 }

  - name: clamps page to >=1 when zero or negative
    request:
      method: GET
      path: /samples/advanced/pagination
      query: { page: "0" }
    expect:
      status: 200
      body_matches:
        response:
          pagination: { page: 1 }
