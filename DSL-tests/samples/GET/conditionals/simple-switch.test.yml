mode: inprocess

tests:
  - name: adult >= 18
    request:
      method: GET
      path: /samples/conditionals/simple-switch
      query: { age: "25" }
    expect:
      status: 200
      body: { response: { category: "adult", age: 25, message: "You are an adult" } }

  - name: teen 13..17
    request:
      method: GET
      path: /samples/conditionals/simple-switch
      query: { age: "15" }
    expect:
      status: 200
      body: { response: { category: "teenager", age: 15, message: "You are a teenager" } }

  - name: child fallthrough
    request:
      method: GET
      path: /samples/conditionals/simple-switch
      query: { age: "7" }
    expect:
      status: 200
      body: { response: { category: "child", age: 7, message: "You are a child" } }

  - name: boundary at 18
    request:
      method: GET
      path: /samples/conditionals/simple-switch
      query: { age: "18" }
    expect:
      status: 200
      body_matches: { response: { category: "adult" } }

  - name: boundary at 13
    request:
      method: GET
      path: /samples/conditionals/simple-switch
      query: { age: "13" }
    expect:
      status: 200
      body_matches: { response: { category: "teenager" } }
