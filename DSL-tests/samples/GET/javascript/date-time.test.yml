mode: inprocess

tests:
  - name: shape includes ISO + numeric fields
    request: { method: GET, path: /samples/javascript/date-time }
    expect:
      status: 200
      body_matches:
        response:
          current_ms: "$type:number"
          current_iso: "$regex:^\\d{4}-\\d{2}-\\d{2}T"
          unix_seconds: "$type:number"
          year: "$type:number"
          month: "$type:number"
          day: "$type:number"
          hours: "$type:number"
          minutes: "$type:number"
