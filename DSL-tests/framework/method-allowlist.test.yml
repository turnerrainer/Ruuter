# Framework: incoming_requests.allowed_method_types defaults to
# GET/POST/PUT/PATCH/DELETE/OPTIONS. Everything else 405 (denied
# by the method allow-list, before routing).
#
# h2ck.me v1 T-15 — a method that IS in the allow-list but doesn't
# match a routed method for a KNOWN path now returns 405 with an
# Allow header listing the registered methods. The old 404 shape
# was RFC-lax (RFC 7231 §7.4.1 wants 405 + Allow when the method
# mismatches on an existing path).
mode: inprocess

tests:
  - name: OPTIONS on known GET path returns 405 with Allow header (h2ck.me v1 T-15)
    request: { method: OPTIONS, path: /samples/ping }
    expect:
      status: 405
