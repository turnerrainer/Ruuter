# Framework invariant: unknown route → 404, not 500. Guards task-016
# from regressing.
mode: inprocess

tests:
  - name: unknown project returns 404
    request: { method: GET, path: /not-a-project/anywhere }
    expect:
      status: 404

  - name: unknown path in known project returns 404
    request: { method: GET, path: /samples/does/not/exist }
    expect:
      status: 404

  # h2ck.me v1 T-15 — wrong method on a KNOWN path now returns
  # 405 Method Not Allowed with an `Allow:` header listing the
  # registered methods. Pre-T-15 this was 404. Pinned here so a
  # future refactor can't downgrade the invariant.
  - name: unknown method on known path returns 405 with Allow header
    request:
      method: DELETE
      path: /samples/ping
    expect:
      status: 405
