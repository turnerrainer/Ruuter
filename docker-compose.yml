services:
  ruuter-rs:
    build:
      context: .
      dockerfile: Dockerfile
    image: ruuter-on-rust:0.4.0
    container_name: ruuter-rs
    ports:
      - "8080:8080"
    volumes:
      - ./DSL:/app/DSL:ro
      - ./constants.ini:/app/constants.ini:ro
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
