version: '3.8'

services:
  ruuter-rs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruuter-rs
    ports:
      - "8080:8080"
    volumes:
      - ./DSL:/app/DSL:ro
      - ./constants.ini:/app/constants.ini:ro
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
