# 043 + 044 A/B — the "target" DSL. Very thin: literal return,
# no ${...} in the body → hits the 037 fast-path (no Boa). This
# minimises the target's own work so the measured delta between
# TCP loopback and UDS/short-circuit represents the TRANSPORT
# cost, not the DSL evaluation cost.

# h2ck.me v1 T-12 — declaration block added to demonstrate
# the declaration surface. `additive: true` means the
# allowlist below is documentation-only; undeclared fields
# still pass through, so this sample keeps its existing
# runtime behaviour. Set `strict: true` or remove `additive`
# to enforce.
declaration:
  description: "043 + 044 A/B — the \"target\" DSL. Very thin: literal return"
  additive: true

respond:
  return:
    ok: true
    served_at: "target"
  next: end
