name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

# Free `ubuntu-24.04-arm` runners are available on public repos since
# 2025-04, so we run every job on both amd64 and arm64 natively. This
# catches arch-specific bugs (endianness, alignment in the wire-level
# security fixtures) BEFORE we publish an arm64 container image via
# publish.yml — Part B of task 066.
jobs:
  # Default feature build — scripting-boa.
  boa:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cache key namespaced by arch so amd64 and arm64 targets
          # don't stomp each other's `target/` (different object
          # code, different linkage).
          key: cargo-boa-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-boa-${{ matrix.runner }}-
      - name: Build (Boa default)
        run: cargo build --release --bin ruuter-on-rust --bin dsl-lint --bin dsl-test
      - name: dsl-lint (errors fail the build)
        run: ./target/release/dsl-lint --dsl DSL --constants constants.ini
      - name: cargo test (Boa backend)
        run: cargo test --release --no-fail-fast
      - name: dsl-test — every .test.yml scenario on Boa
        run: ./target/release/dsl-test --dsl DSL --tests DSL-tests --constants constants.ini
      # Java Ruuter source-of-truth DSL corpus. Any parse error here
      # means the Rust parser lost coverage on files that Java accepts.
      # Warnings are allowed (see compat/EXPECTED-BASELINE.md).
      - name: compat parse gate — Java Ruuter DSL corpus
        run: |
          ./target/release/dsl-lint --dsl compat/java-ruuter/DSL --constants constants.ini
          ./target/release/dsl-lint --dsl compat/java-ruuter/samples --constants constants.ini

  # QuickJS feature — task 051 pluggable backend. Task 036 (per-
  # request session pool) and task 045 (pre-parsed expression
  # registry) only run under this flavour, so regressions on the
  # QuickJS path would silently ship without this job.
  quickjs:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-quickjs-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-quickjs-${{ matrix.runner }}-
      - name: Build (QuickJS backend)
        run: cargo build --release --no-default-features --features scripting-quickjs --bin ruuter-on-rust --bin dsl-lint --bin dsl-test
      - name: dsl-lint
        run: ./target/release/dsl-lint --dsl DSL --constants constants.ini
      - name: cargo test (QuickJS backend)
        run: cargo test --release --no-default-features --features scripting-quickjs --no-fail-fast
      - name: dsl-test — every .test.yml scenario on QuickJS
        run: ./target/release/dsl-test --dsl DSL --tests DSL-tests --constants constants.ini
      - name: compat parse gate — Java Ruuter DSL corpus
        run: |
          ./target/release/dsl-lint --dsl compat/java-ruuter/DSL --constants constants.ini
          ./target/release/dsl-lint --dsl compat/java-ruuter/samples --constants constants.ini
