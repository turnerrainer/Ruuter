# cargo-deny configuration.
#
# Complements cargo-audit (see .cargo/audit.toml) with three checks
# audit does not cover:
#
#   1. licenses  — every dep's license is in the allow-list below
#   2. bans      — no duplicate versions of security-sensitive crates
#   3. sources   — every crate comes from crates.io (no unvetted git URLs)
#
# Enforced in CI via .github/workflows/security.yml.
#
# When adding a new dep triggers a `cargo deny check` failure:
#   * License: add to `allow` below IF the license is permissively
#     compatible with Apache-2.0. Refuse copyleft (GPL/AGPL/SSPL).
#   * Ban: bump one of the two versions so they converge, OR add a
#     scoped exception with a rationale + review date.
#   * Source: replace the git dep with a crates.io release.

[graph]
# Target-specific gating — check every target, not just the one
# CI happens to run on. Otherwise a dep pulled in only for
# `target = "aarch64-unknown-linux-gnu"` would slip through.
all-features = false
no-default-features = false

# -----------------------------------------------------------------
# Advisories — cargo-deny has its OWN advisory reader; it does not
# consult .cargo/audit.toml. Any exception documented for cargo-audit
# must be mirrored here (same IDs, same rationale, same review date)
# or cargo-deny will fail the check while cargo-audit passes.
# Keep this list synchronised with .cargo/audit.toml.
# -----------------------------------------------------------------
[advisories]
version = 2
yanked = "deny"          # never accept a yanked release
ignore = [
    # `instant` — unmaintained. Transitive via parking_lot (boa_engine
    # → hashbrown) and hyper-util's tokio internals. No known vuln;
    # the advisory is "no upstream maintainer." Track upstream
    # migrations (parking_lot → std::sync, boa → later hashbrown)
    # and re-audit. Mirrors .cargo/audit.toml entry.
    # Review: 2026-10-01
    "RUSTSEC-2024-0384",

    # `paste` — unmaintained. Transitive via boa_engine's derive
    # macros. Same posture as `instant`. Bumping boa_engine past
    # 0.20 is the likely fix. Mirrors .cargo/audit.toml entry.
    # Review: 2026-10-01
    "RUSTSEC-2024-0436",
]

# -----------------------------------------------------------------
# Licenses — allow-list. Anything not listed here fails the build.
# -----------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",             # weak copyleft, safe to link
    "CC0-1.0",
    "0BSD",
]
# Explicit refusal — a dep pulling any of these has to be replaced.
# GPL/AGPL/SSPL are incompatible with the Apache-2.0 shipped binary.
# Not listed => implicit refusal via missing from `allow`.

[[licenses.clarify]]
# `ring` uses a custom license file that combines multiple upstream
# licenses (OpenSSL, ISC, MIT). Pin the expression so cargo-deny
# doesn't fail on the ambiguity.
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# -----------------------------------------------------------------
# Bans — duplicate versions of security-critical crates cause
# CVE-fix drift (one path patched, the other not).
# -----------------------------------------------------------------
[bans]
multiple-versions = "warn"       # start soft — tighten to "deny" once tree is clean
wildcards = "deny"               # `foo = "*"` never in Cargo.toml
highlight = "all"
# Explicit denies would go here — e.g. deprecated crates the
# ecosystem has moved past.
deny = []
# Skip duplicates for well-known transitive-churn deps. Empty until
# CI surfaces real offenders.
skip = []
skip-tree = []

# -----------------------------------------------------------------
# Sources — refuse git deps, refuse alternate registries. If a
# crate isn't on crates.io, don't ship it.
# -----------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
